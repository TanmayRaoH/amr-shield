[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api calls to Render backend — must come BEFORE the SPA fallback
# Update this URL after you get your Render service URL
[[redirects]]
  from   = "/api/*"
  to     = "https://amr-shield-api.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — all routes serve index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

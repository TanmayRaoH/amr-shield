[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api calls to Render backend — must come BEFORE the SPA fallback
[[redirects]]
  from   = "/api/*"
  to     = "https://amr-shield.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — all routes serve index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
